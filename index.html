<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Padel 8 Jugadores</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { text-align: center; color: #1b4332; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #2d6a4f; color: white; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        .match-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; padding: 10px; background: #e9ecef; border-radius: 6px; }
        .team { flex: 1; font-weight: bold; }
        .team-right { text-align: right; }
        .score-input { width: 50px; padding: 5px; text-align: center; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { display: block; width: 100%; padding: 12px; background-color: #40916c; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #2d6a4f; }
        .btn-copy { background-color: #25D366; margin-top: 15px; }
        .btn-copy:hover { background-color: #128C7E; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #ddd; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .tab-btn.active { background: #2d6a4f; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Liga de Pádel 8 Jugadores</h1>

    <div class="tab-buttons">
        <button class="tab-btn active" onclick="showTab('clasificacion')">📊 Clasificación</button>
        <button class="tab-btn" onclick="showTab('jornadas')">🎾 Introducir Resultados</button>
    </div>

    <!-- TAB CLASIFICACION -->
    <div id="clasificacion" class="tab-content active">
        <div class="card">
            <h2>Tabla de Clasificación</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Jugador</th>
                        <th>PJ</th>
                        <th>PG 2-0</th>
                        <th>PG 2-1</th>
                        <th>PP 1-2</th>
                        <th>PP 0-2</th>
                        <th>Dif. Sets</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="tabla-body"></tbody>
            </table>
            <button class="btn btn-copy" onclick="copiarWhatsApp()">📋 Copiar para WhatsApp</button>
        </div>
    </div>

    <!-- TAB JORNADAS -->
    <div id="jornadas" class="tab-content">
        <div class="card" id="contenedor-jornadas"></div>
    </div>
</div>

<script>
const jugadores = ["Guille", "Sergio", "Richie", "Carlos", "Kike", "Hernan", "Jesus", "David"];

const calendario = [
    { j: 1, p1: [0, 1, 2, 3], p2: [4, 5, 6, 7] },
    { j: 2, p1: [0, 2, 4, 6], p2: [1, 3, 5, 7] },
    { j: 3, p1: [0, 3, 5, 6], p2: [1, 4, 2, 7] },
    { j: 4, p1: [0, 4, 3, 7], p2: [1, 6, 2, 5] },
    { j: 5, p1: [0, 5, 1, 7], p2: [2, 6, 3, 4] },
    { j: 6, p1: [0, 6, 1, 2], p2: [3, 5, 4, 7] },
    { j: 7, p1: [0, 7, 2, 4], p2: [1, 5, 3, 6] }
];

let resultados = JSON.parse(localStorage.getItem('padel_resultados')) || {};

function showTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
}

function renderJornadas() {
    const container = document.getElementById('contenedor-jornadas');
    container.innerHTML = '<h2>Partidos por Jornada</h2>';
    
    calendario.forEach(j => {
        let html = `<h3>Jornada ${j.j}</h3>`;
        
        // Partido 1
        const resP1 = resultados[`j${j.j}_p1`] || { s1: '', s2: '' };
        html += crearFilaPartido(j.j, 'p1', j.p1, resP1);
        
        // Partido 2
        const resP2 = resultados[`j${j.j}_p2`] || { s1: '', s2: '' };
        html += crearFilaPartido(j.j, 'p2', j.p2, resP2);
        
        container.innerHTML += html + '<hr>';
    });
}

function crearFilaPartido(jornada, partidoId, p, res) {
    const t1 = `${jugadores[p[0]]} / ${jugadores[p[1]]}`;
    const t2 = `${jugadores[p[2]]} / ${jugadores[p[3]]}`;
    const key = `j${jornada}_${partidoId}`;
    
    return `
        <div class="match-row">
            <span class="team">${t1}</span>
            <input type="number" min="0" max="2" class="score-input" id="${key}_s1" value="${res.s1}" onchange="guardarResultado('${key}')">
            <span> - </span>
            <input type="number" min="0" max="2" class="score-input" id="${key}_s2" value="${res.s2}" onchange="guardarResultado('${key}')">
            <span class="team team-right">${t2}</span>
        </div>
    `;
}

function guardarResultado(key) {
    const s1 = document.getElementById(`${key}_s1`).value;
    const s2 = document.getElementById(`${key}_s2`).value;
    
    if (s1 !== '' && s2 !== '') {
        resultados[key] = { s1: parseInt(s1), s2: parseInt(s2) };
    } else {
        delete resultados[key];
    }
    
    localStorage.setItem('padel_resultados', JSON.stringify(resultados));
    calcularClasificacion();
}

function calcularClasificacion() {
    let stats = jugadores.map(nombre => ({
        nombre, pj: 0, pg20: 0, pg21: 0, pp12: 0, pp02: 0, difSets: 0, puntos: 0
    }));

    calendario.forEach(j => {
        ['p1', 'p2'].forEach(partidoId => {
            const res = resultados[`j${j.j}_${partidoId}`];
            if (res && (res.s1 === 2 || res.s2 === 2)) {
                const pareja1 = j[partidoId].slice(0, 2);
                const pareja2 = j[partidoId].slice(2, 4);
                
                const processTeam = (team, mySets, oppSets) => {
                    team.forEach(pIdx => {
                        let p = stats[pIdx];
                        p.pj++;
                        p.difSets += (mySets - oppSets);
                        
                        if (mySets === 2 && oppSets === 0) { p.pg20++; p.puntos += 3; }
                        else if (mySets === 2 && oppSets === 1) { p.pg21++; p.puntos += 2; }
                        else if (mySets === 1 && oppSets === 2) { p.pp12++; p.puntos += 1; }
                        else if (mySets === 0 && oppSets === 2) { p.pp02++; p.puntos += 0; }
                    });
                };

                processTeam(pareja1, res.s1, res.s2);
                processTeam(pareja2, res.s2, res.s1);
            }
        });
    });

    stats.sort((a, b) => b.puntos - a.puntos || b.difSets - a.difSets);

    const tbody = document.getElementById('tabla-body');
    tbody.innerHTML = '';
    stats.forEach((s, idx) => {
        tbody.innerHTML += `
            <tr>
                <td><b>${idx + 1}</b></td>
                <td><b>${s.nombre}</b></td>
                <td>${s.pj}</td>
                <td>${s.pg20}</td>
                <td>${s.pg21}</td>
                <td>${s.pp12}</td>
                <td>${s.pp02}</td>
                <td>${s.difSets > 0 ? '+' + s.difSets : s.difSets}</td>
                <td><b>${s.puntos}</b></td>
            </tr>
        `;
    });
}

function copiarWhatsApp() {
    let stats = jugadores.map(nombre => ({
        nombre, pj: 0, difSets: 0, puntos: 0
    }));

    calendario.forEach(j => {
        ['p1', 'p2'].forEach(partidoId => {
            const res = resultados[`j${j.j}_${partidoId}`];
            if (res && (res.s1 === 2 || res.s2 === 2)) {
                const p1 = j[partidoId].slice(0, 2);
                const p2 = j[partidoId].slice(2, 4);
                
                const addStats = (team, mySets, oppSets) => {
                    team.forEach(pIdx => {
                        stats[pIdx].pj++;
                        stats[pIdx].difSets += (mySets - oppSets);
                        if (mySets === 2 && oppSets === 0) stats[pIdx].puntos += 3;
                        if (mySets === 2 && oppSets === 1) stats[pIdx].puntos += 2;
                        if (mySets === 1 && oppSets === 2) stats[pIdx].puntos += 1;
                    });
                };
                addStats(p1, res.s1, res.s2);
                addStats(p2, res.s2, res.s1);
            }
        });
    });

    stats.sort((a, b) => b.puntos - a.puntos || b.difSets - a.difSets);

    let texto = "🏆 *CLASIFICACIÓN LIGA PÁDEL* 🏆\n\n";
    stats.forEach((s, i) => {
        texto += `${i + 1}. *${s.nombre}* - ${s.puntos} pts (Dif: ${s.difSets > 0 ? '+' + s.difSets : s.difSets})\n`;
    });

    navigator.clipboard.writeText(texto);
    alert("¡Clasificación copiada al portapapeles para pegar en WhatsApp!");
}

renderJornadas();
calcularClasificacion();
</script>
</body>
</html>
